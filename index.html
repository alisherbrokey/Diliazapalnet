<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kino Kodi — 4168</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #182848 0%, transparent 45%),
        linear-gradient(135deg, #050505, #0b1020, #050505);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 22px;
      text-align: center;
      border-radius: 24px;
      background: rgba(20, 20, 30, 0.82);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(15px);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: linear-gradient(135deg, #ff0000, #8b0000);
      box-shadow: 0 0 30px rgba(255,0,0,.35);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .description {
      color: #c8c8c8;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .warning {
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: rgba(255, 193, 7, .08);
      border: 1px solid rgba(255, 193, 7, .25);
      color: #ffd45c;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
      text-decoration: none;
      display: block;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .youtube {
      background: #ff0000;
      color: white;
      box-shadow: 0 8px 25px rgba(255,0,0,.25);
    }

    .timer {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: #aaa;
      display: none;
    }

    .code-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(0, 255, 140, .06);
      border: 1px solid rgba(0,255,140,.2);
    }

    .code-title {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .code {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #00ff88;
      margin-bottom: 15px;
    }

    .telegram {
      background: #229ed9;
      color: white;
    }

    .footer {
      margin-top: 22px;
      color: #666;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🎬</div>

    <h1>Kino Kodini Olish</h1>

    <p class="description">
      Video ni ko‘rib 5+1 qilsang ko‘t san 😎
    </p>

    <div class="warning">
      ⚠️ Avval YouTube kanalimizga obuna bo‘ling
    </div>

    <a
      class="btn youtube"
      href="https://www.youtube.com/@rosky_old"
      target="_blank"
      id="youtubeBtn">
      🔴 YouTube kanaliga obuna bo‘lish
    </a>

    <div class="timer" id="timer">
      ⏳ Iltimos, kuting: <b id="seconds">15</b> soniya
    </div>

    <div class="code-box" id="codeBox">

      <div class="code-title">
        🎟️ Sizning kino kodingiz
      </div>

      <div class="code">
        4168
      </div>

      <a
        class="btn telegram"
        href="https://t.me/Tarjima_kinolar_ujas_bot"
        target="_blank">
        🤖 Telegram botga kirish
      </a>

    </div>

    <div class="footer">
      © 2026 Kino Bot
    </div>

  </div>

  <script>
    const youtubeBtn = document.getElementById("youtubeBtn");
    const timer = document.getElementById("timer");
    const secondsText = document.getElementById("seconds");
    const codeBox = document.getElementById("codeBox");

    let started = false;

    youtubeBtn.addEventListener("click", function () {

      if (started) return;

      started = true;
      timer.style.display = "block";

      let seconds = 15;
      secondsText.textContent = seconds;

      const countdown = setInterval(() => {

        seconds--;
        secondsText.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(countdown);
          timer.classList.add("hidden");
          codeBox.style.display = "block";
        }

      }, 1000);

    });
  </script>

</body>
</html>
